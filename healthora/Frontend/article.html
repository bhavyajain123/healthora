<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Healthora | Article</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="article-page">

        <button
            class="article-back"
            onclick="history.back()"
        >
            ← Back
        </button>


        <div class="article-page-card">

            <img
                id="article-image"
                class="article-page-image"
                src=""
                alt=""
            >


            <div class="article-page-content">

                <span
                    id="article-category"
                    class="article-page-category"
                ></span>


                <h1 id="article-title"></h1>


                <p
                    id="article-time"
                    class="article-page-time"
                ></p>


                <div
                    id="article-content"
                    class="article-page-body"
                ></div>


            </div>

        </div>

    </div>


    <script src="articleContent.js"></script>
    <script type="module" src="articlePage.js"></script>

</body>

</html>
